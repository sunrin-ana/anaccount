spring.datasource.url=jdbc:h2:mem:anaccount;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=http://localhost:9999/authorize
spring.security.oauth2.client.provider.google.token-uri=http://localhost:9999/token
spring.security.oauth2.client.provider.google.jwk-set-uri=http://localhost:9999/jwks
spring.security.oauth2.client.provider.google.user-info-uri=http://localhost:9999/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
