services:
  postgres:
    image: 'postgres:16-alpine'
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anaccount-network
    labels:
      - "org.springframework.boot.service-connection=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anaccount"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    volumes:
      - ./masterkey:/data/masterkey
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anaccount-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - anaccount-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - anaccount-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  anaccount-network:
    driver: bridge